if(k===0){let n=[1,2,3,4,5][i%5];return qMake('m5',i,1,'p độc thân',`Phân lớp p${n} ở trạng thái cơ bản có số electron độc thân là`,unpairedP(n),[0,Math.min(3,n),Math.abs(3-n)],`Theo Hund, p${n} có ${unpairedP(n)} electron độc thân.`,'Hund: đi từng AO trước.','Đừng lấy số electron trong phân lớp làm số độc thân.',true)}if(k===1)return qMake('m5',i,1,'Fe','Fe [Ar]3d⁶4s² thuộc loại nguyên tố','d',['s','p','f'],'Electron phân biệt nằm ở phân lớp d.','(n−1)dᵃnsᵇ → nguyên tố d.','Không gọi Fe là nguyên tố s chỉ vì có 4s².',false);if(k===2)return qMake('m5',i,1,'Lớp ngoài Fe','Fe [Ar]3d⁶4s² có số electron ở lớp ngoài cùng n=4 là','2',['8','6','14'],'Lớp ngoài cùng là n lớn nhất; ở n=4 chỉ có 4s².','Lớp ngoài = n lớn nhất.','Không cộng 3d⁶ vào lớp n=4.',true);if(k===3)return qMake('m5',i,1,'P','P (Z=15) có số electron độc thân là','3',['1','2','5'],'P: [Ne]3s²3p³; p³ có 3e độc thân.','p³ bán bão hòa.','Không tính cặp 3s² là độc thân.',true);return qMake('m5',i,1,'Cr','Cr [Ar]3d⁵4s¹ có tổng số electron độc thân là','6',['5','4','1'],'d⁵ có 5 độc thân, 4s¹ thêm 1.','Hund + ngoại lệ Cr.','Không quên electron 4s¹.',true)}
function m6gen(i,adv){let k=i%5;if(!adv){if(k===0)return qMake('m6',i,0,'Đẳng electron','Dãy nào đẳng electron?','O²⁻, F⁻, Ne, Na⁺, Mg²⁺',['O, F, Ne','Na, Mg, Al','Cl⁻, Na⁺, Ne'],'Tất cả hạt trong dãy đúng đều có 10 electron.','Tính e từng hạt.','Z bằng nhau không phải điều kiện đẳng electron.',true);if(k===1)return qMake('m6',i,0,'Ion → Z','Ion X⁻ có 18 electron. Số hiệu nguyên tử X là','17',['18','19','16'],'X⁻ có nhiều hơn nguyên tử 1e nên Z=18−1=17.','Anion: e=Z+|q|.','Không lấy e ion làm Z.',true);if(k===2)return qMake('m6',i,0,'Cation → Z','Ion M²⁺ có 10 electron. Z của M là','12',['8','10','14'],'Cation M²⁺ mất 2e nên nguyên tử có 12e.','Cation: e=Z−q.','Cần cộng điện tích dương lại.',true);if(k===3)return qMake('m6',i,0,'Tổng hạt','³⁵₁₇Cl⁻ có tổng p+n+e là','53',['52','35','51'],'p=17,n=18,e=18 ⇒ tổng 53.','Ion âm: e=Z+1.','Đừng quên electron tăng thêm.',true);return qMake('m6',i,0,'Suy nguyên tố','Cấu hình [Ne]3s²3p³ ứng với nguyên tố có Z','15',['13','17','18'],'10+2+3=15.','Z=tổng electron.','Không lấy 3+2=5 làm Z.',true)}
if(k===0){let S=46,D=14,Z=(S+D)/4,N=S-2*Z;return qMake('m6',i,1,'Hệ hạt',`Nguyên tử có S=p+n+e=${S}, và (p+e)−n=${D}. Z bằng?`,Z,[N,S/2,Z+1],`2Z+N=${S}; 2Z−N=${D}; cộng hai phương trình: 4Z=${S+D} ⇒ Z=${Z}.`,'Z=(S+D)/4.','D là chênh lệch hạt mang điện và không mang điện.',true)}if(k===1)return qMake('m6',i,1,'Ion tổng hạt','Ion M³⁺ có p+n+e=79 và (p+e)−n=19. Z của M là','26',['23','24','29'],'Với M³⁺: e=Z−3. Từ hai điều kiện suy Z=26.','Ion dương phải thay e=Z−3 trước khi lập hệ.','Không dùng công thức nguyên tử trung hòa 2Z+N trực tiếp.',true);if(k===2)return qMake('m6',i,1,'Tư duy ngược','Muốn viết cấu hình của nguyên tử từ cấu hình ion M²⁺, bước ngược đầu tiên là','khôi phục số electron nguyên tử = e_ion + 2',['viết ngay 4s²','trừ thêm 2e','đổi neutron thành electron'],'Phải tìm tổng electron nguyên tử trước, sau đó mới viết cấu hình.','Nguyên tử ← số e ← cấu hình ion + điện tích.','Không cộng 2 vào phân lớp cuối một cách máy móc.',true);if(k===3)return qMake('m6',i,1,'Cr³⁺','Cr³⁺ (Z=24) có cấu hình','[Ar]3d³',['[Ar]3d⁵','[Ar]3d²4s¹','[Ar]3d⁴'],'Cr trung hòa [Ar]3d⁵4s¹; mất 4s¹ và 2e 3d → 3d³.','Bỏ ns trước rồi (n−1)d.','Không bắt đầu từ 3d⁴4s².',true);return qMake('m6',i,1,'Đẳng electron nâng cao','Cặp nào đẳng electron với Ar?','K⁺ và Cl⁻',['Na⁺ và F','Ca và K⁺','Mg²⁺ và Cl⁻'],'K⁺=18e, Cl⁻=18e.','Tính e sau điện tích.','Không so số proton.',true)}
const gens={m1:m1gen,m2:m2gen,m3:m3gen,m4:m4gen,m5:m5gen,m6:m6gen};let BANK=[];function genBank(){BANK=[];for(const m of modules){for(let i=0;i<50;i++)BANK.push(gens[m.id](i,false));for(let i=0;i<50;i++)BANK.push(gens[m.id](i,true))}}
let quiz={list:[],idx:0,sel:null,checked:false,title:''};function startModule(id,mode){let arr=BANK.filter(q=>q.module===id&&(mode==='all'||(mode==='basic'?q.level==='Cơ bản':q.level==='Nâng cao')));quiz={list:arr,idx:0,sel:null,checked:false,title:modules.find(x=>x.id===id).title};navQuiz()}function startSource(setn){let arr=SOURCE.filter(x=>x.set===setn).map(sourceToQ);quiz={list:arr,idx:0,sel:null,checked:false,title:setn};navQuiz()}function navQuiz(){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-quiz').classList.add('active');$$('.nav').forEach(x=>x.classList.remove('active'));renderQuiz();scrollTo({top:0})}
function moduleIdForSource(q){let t=q.text.toLowerCase();if(/quy ước|không đúng|viết sai|thứ tự|mức năng lượng|bước đầu|3p.*4s|2p.*3s/.test(t))return 'm1';if(/cấu hình.*z=|số hiệu nguyên tử|tổng số electron.*phân lớp|phân lớp cuối|viết nhanh|\[ne\]|\[ar\]/.test(t))return 'm2';if(/cr|cu|bão hòa|bán bão hòa/.test(t))return 'm3';if(/ion|cation|anion|m²|m³|x⁻|x²|ca²|fe²|cr³|cl⁻|o²|na⁺|mg²/.test(t))return 'm4';if(/lớp ngoài cùng|độc thân|kim loại|phi kim|khí hiếm|nguyên tố s|nguyên tố p|nguyên tố d/.test(t))return 'm5';return 'm6'}
function sourceCalc(q){let m=moduleIdForSource(q),t=q.text.toLowerCase();return ['m1','m2','m4','m5','m6'].includes(m)&&/bao nhiêu|số hiệu|tổng|cấu hình|z=|độc thân|điện tích|ion/.test(t)}function sourceToQ(x){let mid=moduleIdForSource(x),m=modules.find(v=>v.id===mid);return {...x,module:mid,level:x.set==='Ôn tập gốc'?'Ôn tập':'Tự luyện',source:'Bám sát file LIVE 4 – Cách viết cấu hình electron',rule:m.formula,expl:`Quay về quy tắc lõi của dạng “${m.title}”: ${m.memory}`,trap:m.trap,calc:sourceCalc(x)}}
function reverseThinking(q){const m=q.module;if(m==='m1')return{goal:'Kiểm/viết cấu hình electron đúng thứ tự.',chain:'Cấu hình đúng ← tổng e = Z + thứ tự mức NL ← Z / số electron đề cho',steps:['Xác định tổng electron cần phân bố.','Điền mức năng lượng từ thấp đến cao.','Cộng lại các số mũ để kiểm tổng e.'],trap:'Không điền mức cao khi mức thấp chưa phù hợp.'};if(m==='m2')return{goal:'Suy cấu hình hoặc Z từ cấu hình.',chain:'Đáp án ← tổng số mũ / lõi khí hiếm + electron ngoài ← dữ kiện Z hoặc cấu hình',steps:['Nếu cho Z: trừ lõi khí hiếm gần nhất.','Phân bố phần e còn lại đúng sức chứa.','Nếu cho cấu hình: cộng toàn bộ electron để ra Z.'],trap:'Đừng quên electron ẩn trong [Ne]=10 hay [Ar]=18.'};if(m==='m3')return{goal:'Kiểm ngoại lệ bền Cr/Cu hoặc trạng thái d.',chain:'Cấu hình bền ← d⁵ hoặc d¹⁰ ← cấu hình dự đoán gần bền',steps:['Viết cấu hình dự đoán theo Aufbau.','Kiểm có gần d⁵/d¹⁰ hay không.','Nếu là Cr/Cu, chuyển 1e 4s sang 3d.'],trap:'Chỉ áp dụng ngoại lệ được học, không chuyển e tùy ý.'};if(m==='m4')return{goal:'Tìm cấu hình ion hoặc suy nguyên tử từ ion.',chain:'Cấu hình ion ← số e ion ← Z ± điện tích ← dữ kiện; hoặc nguyên tử ← e_ion ∓ điện tích',steps:['Tính chính xác số electron của ion.','Viết cấu hình nguyên tử/ion tương ứng.','Với kim loại chuyển tiếp: lấy e ở ns trước (n−1)d.'],trap:'4s được điền trước nhưng bị tách trước 3d khi tạo cation.'};if(m==='m5')return{goal:'Suy lớp ngoài, e độc thân hoặc tính chất.',chain:'Kết luận ← cấu hình đúng ← Z / phân bố electron ← dữ kiện',steps:['Viết cấu hình trước nếu chưa có.','Xác định n lớn nhất và phân lớp được điền cuối.','Dùng Hund để đếm e độc thân hoặc quy tắc lớp ngoài để phân loại.'],trap:'Lớp ngoài cùng và phân lớp cuối là hai khái niệm khác nhau.'};return{goal:'Suy Z rồi mới viết cấu hình trong bài tổng hợp.',chain:'Cấu hình cuối ← Z nguyên tử ← hệ hạt / điện tích ion / số e ion ← dữ kiện đề',steps:['Biểu diễn p=Z và e theo điện tích.','Lập phương trình từ tổng/chênh lệch hạt.','Tìm Z rồi mới viết cấu hình; kiểm tổng electron.'],trap:'Không lấy electron của ion làm Z của nguyên tử.'}}
function analysisHTML(q){if(!q.calc)return'';let r=reverseThinking(q);return `<details class="analysisBox" open><summary>🧠 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đề đang hỏi gì?</h4><p>${r.goal}</p><h4>2. Dữ kiện quyết định</h4><p>${q.rule||modules.find(m=>m.id===q.module)?.formula}</p></div><div class="analysisCard reverse"><h4>↩ Tư duy ngược</h4><div class="analysisArrow">${r.chain}</div><ol class="analysisSteps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></div><div class="analysisHint"><b>Bẫy cần kiểm:</b> ${r.trap}</div></div></details>`}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){nav('home');return}let src=q.source?'<span class="tag amber">Từ file</span>':'';$('#v-quiz').innerHTML=`<div class="qwrap"><div class="pagehead"><div><h2>${esc(quiz.title)}</h2><p>Câu ${quiz.idx+1}/${quiz.list.length} · Enter để kiểm tra/chuyển câu</p></div><button class="btn secondary" onclick="nav('practice')">← Thoát</button></div><div class="card"><div class="qmeta"><span class="tag blue">${esc(q.level||'Luyện tập')}</span>${src}<span class="tag purple">${esc(modules.find(m=>m.id===q.module)?.title||'')}</span></div><div class="qtext">${esc(q.text)}</div>${analysisHTML(q)}<div id="opts">${(q.opts||[]).map((o,i)=>`<button class="opt ${quiz.sel===i?'sel':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div><div class="actionsRow"><button class="btn secondary" ${quiz.idx===0?'disabled':''} onclick="move(-1)">← Trước</button><div style="display:flex;gap:8px"><button class="btn primary" id="checkBtn" onclick="check()">Kiểm tra</button><button class="btn secondary" onclick="move(1)">Sau →</button></div></div></div></div>`}
function choose(i){if(quiz.checked)return;quiz.sel=i;renderQuiz()}function correctIndex(q){return q.a}function check(){let q=quiz.list[quiz.idx];if(quiz.checked){move(1);return}if(quiz.sel===null){toast('Chọn một đáp án trước');return}quiz.checked=true;let ci=correctIndex(q),ok=quiz.sel===ci;st.attempted++;if(ok){st.correct++;st.xp+=10}else{st.xp+=2;if(!st.wrong.some(x=>x.id===q.id))st.wrong.push({...q,chosen:quiz.sel})}let mid=q.module,old=st.done[mid]||0;st.done[mid]=Math.min(100,old+(ok?2:0.5));save();updateTop();$$('.opt').forEach((b,i)=>{if(i===ci)b.classList.add('ok');if(i===quiz.sel&&!ok)b.classList.add('bad');b.disabled=true});let chosen=q.opts[quiz.sel],correct=q.opts[ci];$('#fb').innerHTML=`<div class="feedback ${ok?'explain':'warning'}"><h3>${ok?'✓ Chính xác':'✗ Chưa đúng'}</h3><div class="answerCompare"><div class="answerPill ${ok?'good':'bad'}"><b>Em chọn</b><br>${esc(chosen)}</div><div class="answerPill good"><b>Đáp án đúng</b><br>${esc(correct)}</div></div><p><b>Vì sao?</b> ${esc(q.expl||q.rule)}</p><p><b>Công thức / quy tắc:</b> ${esc(q.rule||'')}</p><p><b>Bẫy dễ sai:</b> ${esc(q.trap||'')}</p>${!ok?`<button class="btn purpleBtn" onclick="openGap('${q.module}')">Mở chuỗi 5 câu tìm lỗ hổng</button>`:''}</div>`;$('#checkBtn').textContent='Câu tiếp →'}
function move(d){let ni=quiz.idx+d;if(ni<0)return;if(ni>=quiz.list.length){toast('Đã hết bộ câu hỏi');nav('report');return}quiz.idx=ni;quiz.sel=null;quiz.checked=false;renderQuiz();scrollTo({top:0})}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();check()}})
function openGap(mid){let m=modules.find(x=>x.id===mid);let qs=[`Điều đầu tiên cần nhận diện trong dạng “${m.title}” là gì?`,`Công thức/quy tắc lõi nào phải bật ra trước?`,`Dữ kiện nào trong đề là dữ kiện quyết định?`,`Bẫy nào dễ khiến em chọn sai?`,`Nếu đổi số liệu nhưng giữ bản chất, em sẽ làm bước đầu tiên nào?`];openModal(`<h2>Chuỗi tìm lỗ hổng · ${m.title}</h2><p class="muted">Trả lời từng câu bằng chính kiến thức vừa sai.</p>${qs.map((x,i)=>`<div class="wrongitem"><b>Bước ${i+1}/5</b><p>${x}</p><input style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px" placeholder="Tự trả lời trước khi xem gợi ý"><details><summary>Gợi ý</summary><p>${i===1?m.formula:i===3?m.trap:m.memory}</p></details></div>`).join('')}`)}
function renderWrong(){let a=st.wrong;$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Mỗi lỗi được giữ lại để quay về đúng quy tắc.</p></div><button class="btn secondary" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${a.length?a.map((q,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><h3>${esc(q.text)}</h3><p><b>Quy tắc cần ôn:</b> ${esc(q.rule||'')}</p><button class="btn purpleBtn" onclick="openGap('${q.module}')">Tìm lỗ hổng</button></div>`).join(''):'<div class="card"><h3>Chưa có câu sai 🎯</h3><p class="muted">Làm bài để hệ thống tự xây sổ lỗi.</p></div>'}`}
function renderReport(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Dữ liệu lưu ngay trên trình duyệt bằng localStorage.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai cần ôn</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${m.icon} ${m.title}</b><span>${Math.round(st.done[m.id]||0)}%</span></div><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div></div>`).join('')}</div>`}
genBank();updateTop();renderHome();
</script></body></html>
